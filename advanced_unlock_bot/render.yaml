services:
  - type: web
    name: advanced-telegram-unlock-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_IDS
        sync: false
      - key: WEBHOOK_URL
        sync: false
      - key: PAYMENT_QR_URL
        sync: false
      - key: PAYMENT_TEXT
        sync: false
